<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Chan ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #f58ca8;
    --dark-pink: #c94d70;
    --light-pink: #ffe4ec;
    --text: #4b3038;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at top left,
            #ffd9e4,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f7a9bd,
            #ffdce6
        );
}

/* =========================
   FLOATING HEARTS
========================= */

#hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.heart {
    position: absolute;
    bottom: -40px;
    animation: floatHeart linear forwards;
    opacity: .7;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* =========================
   WELCOME
========================= */

.welcome {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    position: relative;
    z-index: 2;

    transition: .6s;
}

.welcome-card {
    width: min(500px, 100%);

    padding: 55px 30px;

    text-align: center;

    background: rgba(255,255,255,.94);

    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(100,30,50,.22);

    animation: appear 1s ease;
}

.big-heart {
    font-size: 80px;
    animation: heartbeat 1.5s infinite;
}

.welcome-card .small {
    color: #9a5c6c;
    margin-top: 10px;
}

.welcome-card h1 {
    font-family: Georgia, serif;
    font-style: italic;

    font-size: 48px;

    color: var(--dark-pink);

    margin: 12px 0;
}

.welcome-card p {
    color: #76545e;
    margin-bottom: 25px;
    line-height: 1.7;
}

#openBtn {

    border: none;

    padding: 15px 28px;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #e95c83,
            #c94067
        );

    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(190,50,90,.3);

    transition: .3s;
}

#openBtn:hover {

    transform:
        translateY(-3px)
        scale(1.03);
}

/* =========================
   MAIN
========================= */

.hidden {
    display: none;
}

main {

    width: min(1100px, 94%);

    margin: 30px auto;

    position: relative;
    z-index: 1;

    animation: appear 1s ease;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

.header-heart {
    font-size: 35px;
    animation: heartbeat 2s infinite;
}

header h1 {

    font-family: Georgia, serif;
    font-style: italic;

    font-size:
        clamp(42px, 8vw, 65px);

    color: #8e3654;
}

header h1 span {
    color: #c84669;
}

header p {
    color: #704f59;
    margin-top: 5px;
}

/* =========================
   NAVIGATION
========================= */

.navigation {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 20px;
}

.nav-btn {

    border: none;

    background:
        rgba(255,255,255,.88);

    color: #9b405b;

    padding: 12px 17px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(90,30,50,.12);

    transition: .3s;
}

.nav-btn:hover,
.nav-btn.active {

    background: white;

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px rgba(90,30,50,.18);
}

/* =========================
   CONTAINER
========================= */

.container {

    background:
        rgba(255,255,255,.94);

    border-radius: 25px;

    padding:
        clamp(20px,5vw,45px);

    min-height: 500px;

    box-shadow:
        0 20px 60px rgba(90,30,50,.15);
}

.content-section {

    display: none;

    animation:
        sectionIn .5s ease;
}

.content-section.active {
    display: block;
}

.section-title {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 25px;
}

.section-title span {
    font-size: 30px;
}

.section-title h2 {

    font-family: Georgia, serif;

    font-style: italic;

    color: #9c3e5a;

    font-size: 36px;
}

/* =========================
   LETTER
========================= */

.letter-preview {

    position: relative;

    min-height: 230px;

    padding: 40px;

    border:
        2px dashed
        #e9a5b7;

    border-radius: 18px;

    background:
        linear-gradient(
            rgba(255,255,255,.8),
            rgba(255,244,248,.9)
        );

    cursor: pointer;

    transition: .4s;
}

.letter-preview:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 15px 30px
        rgba(150,50,80,.12);
}

.letter-icon {
    font-size: 45px;
}

.letter-preview h3 {

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 32px;

    color: #b34363;

    margin: 10px 0;
}

.letter-preview p {

    color: #735761;

    line-height: 1.7;
}

.open-text {

    position: absolute;

    right: 20px;
    bottom: 15px;

    font-size: 13px;

    color: #b65a72;
}

/* =========================
   MODALS
========================= */

.modal,
.image-modal {

    position: fixed;

    inset: 0;

    background:
        rgba(35,10,20,.75);

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 100;
}

.modal.show,
.image-modal.show {
    display: flex;
}

.letter-paper {

    position: relative;

    width: min(650px,100%);

    max-height: 90vh;

    overflow-y: auto;

    padding: 45px 35px;

    background:
        repeating-linear-gradient(
            transparent,
            transparent 31px,
            #eadce0 32px
        ),
        #fffdf7;

    border-radius: 10px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.35);

    animation:
        letterOpen .6s ease;
}

.paper-heart {

    text-align: center;

    font-size: 45px;
}

.letter-paper h2 {

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 34px;

    color: #a23d5b;

    margin-bottom: 20px;
}

.letter-text {

    line-height: 2;

    white-space: pre-line;

    font-size: 16px;
}

.signature {

    margin-top: 30px;

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 25px;

    color: #a23d5b;
}

.close-btn,
.close-image {

    position: absolute;

    top: 12px;
    right: 15px;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border: none;

    background: #f5c3d0;

    color: #8c3851;

    font-size: 25px;

    cursor: pointer;
}

/* =========================
   MUSIC
========================= */

.music-card {

    text-align: center;

    max-width: 600px;

    margin: auto;

    padding: 45px 25px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #ffe4ec,
            #fff
        );

    box-shadow:
        0 15px 35px
        rgba(120,40,70,.12);
}

.vinyl {

    width: 120px;
    height: 120px;

    margin:
        0 auto 25px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #f1b3c4 0 8%,
            #3d2730 9% 60%,
            #20171b 61%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    font-size: 30px;

    animation:
        spin 5s linear infinite;

    animation-play-state: paused;
}

.music-card.playing .vinyl {
    animation-play-state: running;
}

.music-card h3 {
    font-size: 22px;
}

.music-card p {
    color: #88636d;
}

.progress-container {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 25px 0;
}

#progress {

    flex: 1;

    accent-color: #d9587b;

    cursor: pointer;
}

.play-button {

    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: none;

    background: #d9577a;

    color: white;

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(210,70,110,.3);
}

/* =========================
   NOTES
========================= */

.notes-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap: 20px;
}

.note-card {

    padding: 25px;

    border-radius: 20px;

    background: #fff7fa;

    border:
        1px solid
        #f4ccd7;

    transition: .3s;
}

.note-card:hover {

    transform:
        translateY(-7px)
        rotate(-1deg);

    box-shadow:
        0 15px 25px
        rgba(130,50,70,.12);
}

.note-card span {
    font-size: 35px;
}

.note-card h3 {

    color: #a3405d;

    margin: 10px 0;
}

.note-card p {

    line-height: 1.7;

    color: #735761;
}

/* =========================
   GALLERY
========================= */

.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 18px;
}

.gallery-item {

    aspect-ratio: 1;

    overflow: hidden;

    border-radius: 18px;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(100,30,50,.12);

    background: #f8d9e2;
}

.gallery-item img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: .5s;
}

.gallery-item:hover img {

    transform:
        scale(1.08);
}

.gallery-hint {

    text-align: center;

    margin-top: 20px;

    color: #95606d;
}

/* =========================
   VIDEOS
========================= */

.videos-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap: 25px;
}

.video-card {

    background: #fff7fa;

    border:
        1px solid
        #f4ccd7;

    border-radius: 20px;

    padding: 15px;

    overflow: hidden;

    transition: .3s;
}

.video-card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 15px 30px
        rgba(130,50,70,.12);
}

.video-card video {

    width: 100%;

    display: block;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    border-radius: 14px;

    background: #24171c;
}

.video-card h3 {

    color: #a3405d;

    margin:
        15px 5px 5px;

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 24px;
}

.video-card p {

    color: #735761;

    margin:
        0 5px 8px;

    font-size: 14px;
}

/* =========================
   IMAGE VIEWER
========================= */

.image-modal img {

    max-width: 90%;

    max-height: 85vh;

    border-radius: 15px;

    box-shadow:
        0 20px 60px black;
}

/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 25px;

    color: #805866;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes sectionIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes letterOpen {

    from {
        opacity: 0;
        transform:
            scale(.85)
            rotate(-2deg);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            rotate(0);
    }
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .welcome-card {
        padding: 40px 20px;
    }

    .welcome-card h1 {
        font-size: 40px;
    }

    .navigation {
        gap: 7px;
    }

    .nav-btn {

        padding:
            10px 12px;

        font-size: 12px;
    }

    .container {
        padding:
            20px 15px;
    }

    .letter-preview {
        padding:
            25px 20px;
    }

    .open-text {

        position: static;

        display: block;

        margin-top: 20px;
    }

    .letter-paper {
        padding:
            40px 22px;
    }

    .letter-text {

        font-size: 14px;

        line-height: 1.9;
    }

    .videos-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>
